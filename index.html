<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TODOTODAY</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>TODOTODAY</h1>

    <form id="add-form" class="add">
      <input id="new-title" type="text" placeholder="What needs doing?"
             autocomplete="off" autofocus aria-label="New task">
      <button type="submit">Add</button>
    </form>

    <ul id="tasks" class="tasks"></ul>
    <p id="empty" class="empty">No tasks yet. Add one above.</p>

    <div class="toolbar">
      <button id="export" type="button">Export backup</button>
      <button id="import" type="button">Import backup</button>
      <input id="file" type="file" accept="application/json,.json" hidden>
      <span id="hint" class="hint" role="status" aria-live="polite"></span>
    </div>
  </main>

  <!-- Task logic (pure, also tested in Node) -->
  <script src="todo.js"></script>

  <!-- Page glue: render, save to the browser, export/import -->
  <script>
    (function () {
      "use strict";
      var storage = window.localStorage;
      var tasks = Todo.load(storage);

      var listEl = document.getElementById("tasks");
      var emptyEl = document.getElementById("empty");
      var form = document.getElementById("add-form");
      var input = document.getElementById("new-title");
      var hintEl = document.getElementById("hint");
      var hintTimer = null;

      function showHint(message) {
        hintEl.textContent = message;
        hintEl.classList.add("show");
        if (hintTimer) clearTimeout(hintTimer);
        hintTimer = setTimeout(function () {
          hintEl.classList.remove("show");
        }, 1500);
      }

      function persist() {
        Todo.save(storage, tasks);
        render();
      }

      function render() {
        listEl.innerHTML = "";
        tasks.forEach(function (task) {
          var li = document.createElement("li");
          li.className = "task" + (task.done ? " done" : "");

          var toggle = document.createElement("button");
          toggle.type = "button";
          toggle.className = "check";
          toggle.textContent = task.done ? "\u2713" : "\u25cb";
          toggle.setAttribute("aria-pressed", String(task.done));
          toggle.setAttribute("aria-label", task.done ? "Mark as not done" : "Mark as done");
          toggle.addEventListener("click", function () {
            tasks = Todo.toggleTask(tasks, task.id);
            persist();
          });

          var title = document.createElement("input");
          title.type = "text";
          title.className = "title-input";
          title.value = task.title;
          title.setAttribute("aria-label", "Task title");
          title.addEventListener("change", function () {
            tasks = Todo.editTask(tasks, task.id, title.value);
            persist();
            showHint("Saved");
          });

          var remove = document.createElement("button");
          remove.type = "button";
          remove.className = "remove";
          remove.textContent = "\u2715";
          remove.setAttribute("aria-label", "Delete task");
          remove.addEventListener("click", function () {
            tasks = Todo.deleteTask(tasks, task.id);
            persist();
          });

          li.appendChild(toggle);
          li.appendChild(title);
          li.appendChild(remove);
          listEl.appendChild(li);
        });
        emptyEl.style.display = tasks.length ? "none" : "block";
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        tasks = Todo.addTask(tasks, input.value);
        input.value = "";
        persist();
      });

      // --- Export ---
      document.getElementById("export").addEventListener("click", function () {
        var blob = new Blob([Todo.exportTasks(tasks)], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "todotoday-backup.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showHint("Exported");
      });

      // --- Import (replaces the current list) ---
      var fileInput = document.getElementById("file");
      document.getElementById("import").addEventListener("click", function () {
        fileInput.click();
      });
      fileInput.addEventListener("change", function () {
        var file = fileInput.files && fileInput.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            tasks = Todo.importTasks(String(reader.result));
            persist();
            showHint("Imported");
          } catch (err) {
            showHint("Could not read that file");
          }
        };
        reader.readAsText(file);
        fileInput.value = "";
      });

      render();
    })();
  </script>
</body>
</html>
